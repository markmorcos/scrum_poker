events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Hashed assets are immutable, but a 404 for one (e.g. a request that hit an
    # old pod mid-deploy) must never be cached by the browser or the CDN
    map $status $asset_cache_control {
        404     "no-store";
        default "public, max-age=31536000, immutable";
    }

    server {
        listen 80;
        server_name localhost;

        root /app/static;

        # Hashed build assets: never fall back to index.html. A missing bundle
        # (e.g. an old hash after a deploy) must be a 404, not an HTML page that
        # browsers reject as a module script and the CDN caches under the .js URL.
        location /assets/ {
            try_files $uri =404;
            add_header Cache-Control $asset_cache_control always;
        }

        # Frontend (SPA): always revalidate index.html so a deploy is picked up
        # immediately instead of pointing at bundles that no longer exist
        location / {
            try_files $uri $uri/ /index.html;
            add_header Cache-Control "no-cache";
        }

        # Backend API proxy
        location /ws {
            proxy_pass http://localhost:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
} 